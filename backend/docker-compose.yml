version: '3.8'

services:
  module2-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lcdr-module2-backend
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DATABASE_PATH=/app/data/module2.db
      - JWT_SECRET=production-secret-replace-in-env-file-la-casa-de-rozgaar
      - INTELLIGENCE_PROVIDER=mock
      - MODULE1_API_URL=http://module1-backend:3000/api/v1
      - CORS_ORIGIN=http://localhost:5173
    volumes:
      - module2-data:/app/data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  module2-data:
    name: lcdr-module2-sqlite-data
