version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: lacasa-postgres
    environment:
      POSTGRES_DB: lacasa_intelligence
      POSTGRES_USER: lacasa
      POSTGRES_PASSWORD: lacasa_dev_password
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lacasa"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - lacasa-network

  redis:
    image: redis:7-alpine
    container_name: lacasa-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - lacasa-network

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: lacasa-api
    environment:
      NODE_ENV: development
      PORT: 3001
      DATABASE_URL: postgresql://lacasa:lacasa_dev_password@postgres:5432/lacasa_intelligence
      REDIS_HOST: redis
      REDIS_PORT: 6379
      ML_SERVICE_URL: http://ml-service:8000
      LOG_LEVEL: debug
      LOG_PRETTY: "true"
    ports:
      - "3001:3001"
    volumes:
      - ./src:/app/src
      - ./package.json:/app/package.json
      - ./tsconfig.json:/app/tsconfig.json
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - lacasa-network
    command: npm run dev

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: lacasa-worker
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://lacasa:lacasa_dev_password@postgres:5432/lacasa_intelligence
      REDIS_HOST: redis
      REDIS_PORT: 6379
      ML_SERVICE_URL: http://ml-service:8000
      LOG_LEVEL: debug
      WORKER_CONCURRENCY: 3
    volumes:
      - ./src:/app/src
      - ./package.json:/app/package.json
      - ./tsconfig.json:/app/tsconfig.json
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - lacasa-network
    command: npm run worker:dev

  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    container_name: lacasa-ml-service
    environment:
      PORT: 8000
      LOG_LEVEL: info
    ports:
      - "8000:8000"
    volumes:
      - ./ml-service/models:/app/models
      - ./ml-service/app:/app/app
    networks:
      - lacasa-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  lacasa-network:
    driver: bridge
